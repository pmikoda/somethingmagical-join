<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Przepis</title>
    <style>
      :root {
        --bg: #fffbf5;
        --card: #ffffff;
        --soft: #fbf3e8;
        --text: #2b2420;
        --muted: #6b5f57;
        --accent: #a84a25;
        --border: #f3e6d3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 20px;
        line-height: 1.5;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 16px 18px;
      }
      .servings {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .stepper button {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--soft);
        color: var(--text);
        font-size: 24px;
        font-weight: 700;
        cursor: pointer;
      }
      .count {
        min-width: 32px;
        text-align: center;
        font-size: 20px;
        font-weight: 800;
      }
      ul,
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li.ingredient {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      li.ingredient:last-child {
        border-bottom: 0;
      }
      .qty {
        font-weight: 700;
        white-space: nowrap;
      }
      ol li {
        display: flex;
        gap: 10px;
        padding: 8px 0;
      }
      .num {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--accent);
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button.copy {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        margin-top: 12px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="error" hidden>
        <section>
          <h1>Nie udało się otworzyć przepisu</h1>
          <p class="muted">Link jest niepełny. Poproś o wysłanie go jeszcze raz.</p>
        </section>
      </div>

      <div id="recipe" hidden>
        <h1 id="name"></h1>
        <section class="servings">
          <strong>Porcje</strong>
          <div class="stepper">
            <button id="less" type="button" aria-label="Mniej porcji">−</button>
            <span id="servings" class="count" aria-live="polite"></span>
            <button id="more" type="button" aria-label="Więcej porcji">+</button>
          </div>
        </section>
        <section>
          <h2>Składniki</h2>
          <ul id="ingredients"></ul>
          <button id="copy" class="copy" type="button">Skopiuj listę zakupów</button>
        </section>
        <section id="steps-box">
          <h2>Przygotowanie</h2>
          <ol id="steps"></ol>
        </section>
        <p class="muted">Wysłane z aplikacji SomethingMagical.</p>
      </div>
    </main>

    <script>
      // R54: the recipe travels in the #fragment (base64url JSON), so it never reaches the server.
      // Everything is written with textContent — the link may come from anyone.
      function decode(encoded) {
        try {
          const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
          const binary = atob(base64 + '==='.slice((base64.length + 3) % 4));
          const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
          const wire = JSON.parse(new TextDecoder().decode(bytes));
          if (wire.v !== 1 || typeof wire.n !== 'string' || typeof wire.s !== 'number') return null;
          if (!Array.isArray(wire.i) || !Array.isArray(wire.k)) return null;
          return wire;
        } catch {
          return null;
        }
      }

      function format(value, unit) {
        const step = unit === 'g' || unit === 'ml' ? 1 : unit === 'kg' || unit === 'l' ? 0.01 : 0.1;
        const rounded = Math.round(value / step) * step;
        return String(Math.round(rounded * 100) / 100).replace('.', ',');
      }

      const recipe = decode(location.hash.slice(1));
      if (!recipe) {
        document.getElementById('error').hidden = false;
      } else {
        const base = recipe.s > 0 ? recipe.s : 1;
        let servings = Math.max(1, Math.round(base));
        document.title = String(recipe.n);
        document.getElementById('name').textContent = String(recipe.n);
        document.getElementById('recipe').hidden = false;

        const lines = () =>
          recipe.i.map(([name, quantity, unit]) => [
            String(name),
            `${format((Number(quantity) * servings) / base, String(unit))} ${String(unit)}`,
          ]);

        function render() {
          document.getElementById('servings').textContent = String(servings);
          const list = document.getElementById('ingredients');
          list.replaceChildren();
          for (const [name, amount] of lines()) {
            const item = document.createElement('li');
            item.className = 'ingredient';
            const label = document.createElement('span');
            label.textContent = name;
            const qty = document.createElement('span');
            qty.className = 'qty';
            qty.textContent = amount;
            item.append(label, qty);
            list.append(item);
          }
        }

        const steps = document.getElementById('steps');
        recipe.k.forEach((text, index) => {
          const item = document.createElement('li');
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = String(index + 1);
          const body = document.createElement('span');
          body.textContent = String(text);
          item.append(num, body);
          steps.append(item);
        });
        document.getElementById('steps-box').hidden = recipe.k.length === 0;

        document.getElementById('less').onclick = () => {
          servings = Math.max(1, servings - 1);
          render();
        };
        document.getElementById('more').onclick = () => {
          servings = Math.min(99, servings + 1);
          render();
        };
        document.getElementById('copy').onclick = async (event) => {
          const text = [
            `${recipe.n} (${servings})`,
            ...lines().map(([name, amount]) => `☐ ${name} — ${amount}`),
          ].join('\n');
          try {
            await navigator.clipboard.writeText(text);
            event.target.textContent = 'Skopiowano ✓';
          } catch {
            event.target.textContent = 'Nie udało się skopiować';
          }
        };
        render();
      }
    </script>
  </body>
</html>
